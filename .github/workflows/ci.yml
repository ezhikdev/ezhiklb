name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install HAProxy for generated configuration checks
        run: sudo apt-get update && sudo apt-get install -y haproxy
      - name: Vet Go
        run: go vet ./...
      - name: Test Go
        run: go test ./...
      - name: Check installer and uninstall script syntax
        run: |
          for script in scripts/install.sh scripts/uninstall-node.sh scripts/uninstall-panel.sh; do
            bash -n "$script"
          done
      - name: Build web
        working-directory: web
        run: npm run build
